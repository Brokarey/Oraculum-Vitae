function showPage(id){
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});

if(id==='page-faq'){initFAQ();}
}
function toggleAuth(type){
document.getElementById('tab-login').classList.toggle('active',type==='login');
document.getElementById('tab-register').classList.toggle('active',type==='register');
document.getElementById('form-login').style.display=type==='login'?'flex':'none';
document.getElementById('form-register').style.display=type==='register'?'flex':'none';
}
function showModal(title,msg){
document.getElementById('modal-title').innerText = title;
document.getElementById('modal-msg').innerText = msg;
document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal(){
document.getElementById('modal-overlay').style.display = 'none';
}
function enterPortal(){
document.getElementById('page-login').classList.remove('active');
document.getElementById('main-header').style.display = 'flex';
showPage('page-dashboard');
updateCreditsDisplay();
checkBalloon();
}
function handleLogin(){
var email=document.getElementById('login-email').value;
var pass=document.getElementById('login-pass').value;
if(email==='g@gmail.com'&&pass==='gggggg'){
currentUser={name:"Gui Admin",email:email,credits:999999,isMago:true};
localStorage.setItem('orculum_user',JSON.stringify(currentUser));
enterPortal();
return;
}
var stored=localStorage.getItem('user_'+email);
if(stored){
var user=JSON.parse(stored);
if(user.pass===pass){
currentUser=user;
localStorage.setItem('orculum_user',JSON.stringify(user));
enterPortal();
}else{showModal("Erro","Senha incorreta.");}
}else{showModal("Erro","Usuario nao encontrado.");}
}
function handleRegister(){
var name=document.getElementById('reg-name').value;
var email=document.getElementById('reg-email').value;
var pass=document.getElementById('reg-pass').value;
var confirm=document.getElementById('reg-pass-confirm').value;
var terms=document.getElementById('reg-terms').checked;
if(name.length<3){return showModal("Erro","Nome muito curto.");}
if(email.indexOf('@')<0){return showModal("Erro","E-mail invalido.");}
if(pass!==confirm){return showModal("Erro","As senhas nao coincidem.");}
if(!terms){return showModal("Erro","Aceite os termos.");}
var userData={name:name,email:email,pass:pass,credits:50,isMago:false};
localStorage.setItem('user_'+email,JSON.stringify(userData));
localStorage.setItem('orculum_user',JSON.stringify(userData));
currentUser=userData;
enterPortal();
}
function logout(){
localStorage.removeItem('orculum_user');
currentUser=null;
document.getElementById('main-header').style.display = 'none';
document.getElementById('page-login').classList.add('active');
document.querySelectorAll('.page').forEach(function(p){
if(p.id!=='page-login'){p.classList.remove('active');}
});
window.scrollTo(0,0);
}
function updateCreditsDisplay(){
document.getElementById('display-credits').innerText = currentUser.isMago?'∞':currentUser.credits;
}
function checkBalloon(){
var key = 'balloon_'+currentUser.email;
var today = new Date().toDateString();
if(localStorage.getItem(key)!==today){
var b = document.getElementById('mystic-balloon');
document.getElementById('balloon-text').innerText = FRASES_MISTICAS[Math.floor(Math.random()*FRASES_MISTICAS.length)];
b.style.display = 'block';
setTimeout(function(){b.style.display='none';},6000);
localStorage.setItem(key,today);
}
}

if(!currentUser.isMago && currentUser.credits<cost){return showModal("Creditos Insuficientes","Adquira mais creditos para esta consulta.");}

}else{
descEl.innerHTML = "Concentre-se e digite sua pergunta objetiva. Depois clique em Iniciar Consulta para revelar as cartas. Esta tiragem utiliza "+count+" cartas ("+cost+" creditos).";
}
document.getElementById('reading-result').style.display = 'none';

document.getElementById('question-wrap').style.display = 'block';
document.getElementById('btn-start-reading').style.display = 'block';

container.innerHTML = '';
}
function startCardSelection(){
var q = document.getElementById('reading-question').value;
if(!q || q.trim().length<3){showModal("Atencao","Escreva sua pergunta objetiva antes de iniciar.");return;}
currentReading.active = true;
currentReading.question = q;
document.getElementById('question-wrap').style.display = 'none';
buildCardGrid();
}
function buildCardGrid(){
var container = document.getElementById('cards-container');
container.innerHTML = '';
var pool;
if(currentReading.count===2 && currentReading.cardsSelected===0){
currentReading.phase = 'major';
pool = DECK.slice(0,22);
document.getElementById('reading-desc').innerText = "Passo 1 de 2: escolha 1 carta dos ARCANOS MAIORES.";
}else if(currentReading.count===2 && currentReading.cardsSelected===1){
currentReading.phase = 'minor';
pool = DECK.slice(22);
document.getElementById('reading-desc').innerText = "Passo 2 de 2: agora escolha 1 carta dos ARCANOS MENORES.";
}else{
pool = DECK.slice();
}
var shuffled = pool.slice().sort(function(){return Math.random()-0.5;});
for(var i=0;i<shuffled.length;i++){
(function(card,idx){
var slot = document.createElement('div');
slot.className = 'card-slot';
slot.innerHTML = '<div class="card-inner"><div class="card-back"></div><div class="card-front"><h4>'+card.n+'</h4></div></div><div class="card-num">'+(idx+1)+'</div>';
slot.onclick = function(){revealCard(this,card);};
container.appendChild(slot);
})(shuffled[i],i);
}
}
function revealCard(el,cardData){
if(!currentReading.active || el.classList.contains('flipped') || currentReading.cardsSelected>=currentReading.count){return;}
if(currentReading.cardsSelected===0 && !currentUser.isMago){
currentUser.credits -= currentReading.cost;
localStorage.setItem('user_'+currentUser.email,JSON.stringify(currentUser));
localStorage.setItem('orculum_user',JSON.stringify(currentUser));
updateCreditsDisplay();
}
el.classList.add('flipped');
currentReading.cardsSelected++;
currentReading.selectedCards.push(cardData);
if(currentReading.count===2 && currentReading.cardsSelected===1){
setTimeout(function(){buildCardGrid();},800);
return;
}
if(currentReading.cardsSelected===currentReading.count){
currentReading.active = false;
generateNarrative();
}
}

function calculateNumerology(){
var nome = document.getElementById('num-nome').value.toUpperCase().replace(/[^A-Z]/g,'');
var data = document.getElementById('num-data').value.replace(/-/g,'');
if(!nome||!data){return showModal("Erro","Preencha nome e data.");}
var map = {A:1,J:1,S:1,B:2,K:2,T:2,C:3,L:3,U:3,D:4,M:4,V:4,E:5,N:5,W:5,F:6,O:6,X:6,G:7,P:7,Y:7,H:8,Q:8,Z:8,I:9,R:9};
var vogais = "AEIOU";
function reduce(n){while(n>9&&n!==11&&n!==22){n=n.toString().split('').reduce(function(a,b){return parseInt(a)+parseInt(b);},0);}return n;}
var mot=0,imp=0,exp=0;
for(var ci=0;ci<nome.length;ci++){
var val = map[nome[ci]]||0;
exp += val;
if(vogais.indexOf(nome[ci])>=0){mot += val;}else{imp += val;}
}
var dest = data.split('').reduce(function(a,b){return parseInt(a)+parseInt(b);},0);
var res = document.getElementById('num-result');
res.style.display = 'block';
res.innerHTML = '<h3>Seu Perfil Numerologico</h3><p><strong>Motivacao (Alma):</strong> '+reduce(mot)+'</p><p><strong>Impressao (Ego):</strong> '+reduce(imp)+'</p><p><strong>Expressao (Personalidade):</strong> '+reduce(exp)+'</p><p><strong>Destino (Caminho):</strong> '+reduce(dest)+'</p>';
}
